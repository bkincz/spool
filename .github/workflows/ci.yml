name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [master, main, develop]

permissions:
    contents: read

jobs:
    test:
        name: Test
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node-version: [22, 24]

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm run type-check

            - name: Lint
              run: pnpm run lint

            - name: Format check
              run: pnpm run format:check

            - name: Test (with coverage)
              run: pnpm run test:coverage

            - name: Upload coverage to Codecov
              if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./packages/cli/coverage/lcov.info
                  fail_ci_if_error: false

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: packages/cli/dist
                  retention-days: 7

    smoke:
        name: Smoke (scaffold + install + build)
        runs-on: ${{ matrix.os }}
        needs: test
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build CLI
              run: pnpm run build

            - name: Scaffold a workspace
              shell: bash
              run: node packages/cli/dist/index.js create "$RUNNER_TEMP/smoke" --name smoke --host shell --remotes dashboard --pm pnpm --addons none --no-install

            - name: Add a svelte remote
              shell: bash
              working-directory: ${{ runner.temp }}/smoke
              run: node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" add widget --framework svelte --no-install

            - name: Link the local CLI into the scaffold
              shell: bash
              working-directory: ${{ runner.temp }}/smoke
              run: |
                  node -e 'const fs=require("fs");const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));pkg.devDependencies["@bkincz/spool"]="file:"+process.env.GITHUB_WORKSPACE.replaceAll("\\","/")+"/packages/cli";fs.writeFileSync("package.json",JSON.stringify(pkg,null,"\t")+"\n");'

            - name: Install workspace dependencies
              shell: bash
              working-directory: ${{ runner.temp }}/smoke
              run: pnpm install --no-frozen-lockfile

            - name: Type-check workspace
              shell: bash
              working-directory: ${{ runner.temp }}/smoke
              run: pnpm -r exec tsc --noEmit

            - name: Doctor
              shell: bash
              working-directory: ${{ runner.temp }}/smoke
              run: node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" doctor

            - name: Build workspace
              shell: bash
              working-directory: ${{ runner.temp }}/smoke
              run: node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" build

            - name: Check generated formatting
              shell: bash
              working-directory: ${{ runner.temp }}/smoke
              run: pnpm dlx prettier@3 --check .
